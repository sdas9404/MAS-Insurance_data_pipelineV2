# Exploratory synthetic priors; not calibrated population statistics. No labels.
version: unlabeled_v1
population_seed: 20261117
schedule_seed: 20261118
background_parameter_seed: 20261119
run_seeds:
- 1103
- 2207
- 3301
- 4409
n_drivers: 90
trips_per_driver: 10
simulation_step_s: 0.1
telemetry_interval_s: 0.5
lateral_resolution_m: 0.5
wave_seconds: 600
departure_window_s: 240
clearance_s: 1800
time_to_teleport_s: 300
background_per_wave:
  low: 45
  moderate: 135
  high: 270
dependencies:
  emergencyDecel: max(sampled emergencyDecel, decel)
  apparentDecel: decel * apparentDecelRatio
  lcPushyGap: minGapLat * (1-lcPushy); equivalent alternative encoding, not an independent
    draw
  tau: 6% low-tail draw intentionally permits tau < actionStepLength; may reduce safety
  all_others: independent conditional on constants; no latent classes
events:
  harsh_acceleration_mps2: 2.5
  hard_braking_mps2: 4.0
  speed_excess_mps: 0.5
  short_headway_s: 1.0
  headway_min_speed_mps: 2.0
  near_miss_ttc_s: 1.5
